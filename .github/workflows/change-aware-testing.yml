name: Change-Aware Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: change-aware-testing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-aware-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          # Check out the PR head itself (not the merge commit) so the working tree matches HEAD_SHA.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and pytest
        run: python -m pip install -e . pytest

      - name: Run change-aware selection and selected tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/run_change_aware_tests.py --repo . --base "$BASE_SHA" --head "$HEAD_SHA"
